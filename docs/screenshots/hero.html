<!doctype html>
<!--
  The README's hero picture (hero.jpg): the launcher's screenshots in perspective beside its icon,
  name and what it is (the name lives in the README, never in the launcher itself).
  Rendered at 2400 x 1260 with a headless Chromium, e.g.:
    msedge --headless=new --hide-scrollbars --window-size=2400,1260 --screenshot=hero.png hero.html
  then saved as hero.jpg. Retake the screenshots (1280 x 800 CSS px, twice the pixels) when the
  interface changes.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>GileaLauncher</title>
<style>
  @font-face { font-family: "Exo 2"; src: url("../../assets/fonts/exo-2-latin.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Inter"; src: url("../../assets/fonts/inter-latin.woff2") format("woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2400px; height: 1260px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(1200px 900px at 78% 38%, rgba(23, 195, 162, 0.20), transparent 60%),
      radial-gradient(900px 700px at 18% 85%, rgba(64, 190, 110, 0.16), transparent 65%),
      radial-gradient(700px 500px at 10% 10%, rgba(23, 195, 162, 0.10), transparent 70%),
      linear-gradient(160deg, #07130f 0%, #04100c 45%, #020806 100%);
    color: #e9f5f0;
    font-family: "Inter", sans-serif;
  }
  /* A faint grid, as landing pages draw it, fading out at the edges. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(64, 190, 110, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(64, 190, 110, 0.07) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(1300px 900px at 60% 50%, #000 30%, transparent 80%);
  }
  .copy { position: absolute; left: 150px; top: 230px; width: 820px; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 30px; }
  .icon { display: block; flex: none; width: 140px; height: 140px; filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 50px rgba(23, 195, 162, 0.25)); }
  .name { font-family: "Exo 2", sans-serif; font-weight: 700; font-size: 92px; line-height: 1; letter-spacing: 0.01em;
          background: linear-gradient(180deg, #ffffff 0%, #bff3e3 70%, #6fdcb9 100%); -webkit-background-clip: text; color: transparent; }
  .name b { font-weight: 300; background: linear-gradient(180deg, #7ff0cf 0%, #3fe0b6 100%); -webkit-background-clip: text; color: transparent; }
  h1 { margin-top: 48px; font-family: "Exo 2", sans-serif; font-weight: 600; font-size: 50px; line-height: 1.2; letter-spacing: 0.005em;
       background: linear-gradient(180deg, #ffffff 0%, #d9f7ee 75%, #a6ecd6 100%); -webkit-background-clip: text; color: transparent; }
  h1 em { font-style: normal; background: linear-gradient(180deg, #7ff0cf 0%, #3fe0b6 100%); -webkit-background-clip: text; color: transparent; }
  .lead { margin-top: 28px; font-size: 30px; line-height: 1.5; color: rgba(222, 240, 233, 0.72); }
  .chips { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 52px; padding: 0; list-style: none; }
  .chips li { padding: 14px 26px; border-radius: 999px; font-size: 26px; font-weight: 600; color: #c9f2e5;
              background: rgba(23, 195, 162, 0.10); border: 1px solid rgba(63, 224, 182, 0.35); }
  .os { margin-top: 44px; font-size: 26px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(201, 242, 229, 0.55); }

  /* The screenshots, stacked in perspective like cards leaning back to the right. */
  .stage { position: absolute; left: 860px; top: 0; width: 1600px; height: 1260px; }
  /* Each card leans the same way on its own (no shared 3D space: the cards never cut through each
     other), stacked by plain painting order. */
  .shot { position: absolute; width: 1150px; border-radius: 22px; overflow: hidden;
          transform: perspective(2400px) rotateY(-26deg) rotateX(6deg); transform-origin: 0 50%;
          border: 2px solid rgba(63, 224, 182, 0.35);
          box-shadow: 0 60px 140px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(0, 0, 0, 0.6), 0 0 120px rgba(23, 195, 162, 0.12); }
  .shot img { display: block; width: 100%; }
  /* A glassy shine across each card. */
  .shot::after { content: ""; position: absolute; inset: 0; pointer-events: none;
                 background: linear-gradient(115deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.0) 35%, rgba(255, 255, 255, 0) 70%, rgba(63, 224, 182, 0.06) 100%); }
  .back  { left: 560px; top: 60px;  z-index: 1; width: 1020px; filter: brightness(0.6) saturate(0.9); }
  .mid   { left: 330px; top: 250px; z-index: 2; width: 1080px; filter: brightness(0.8); }
  .front { left: 90px;  top: 460px; z-index: 3; }
  /* The light the front card throws on the floor. */
  .glow { position: absolute; left: 1050px; top: 1080px; width: 1100px; height: 220px; border-radius: 50%;
          background: radial-gradient(closest-side, rgba(23, 195, 162, 0.35), transparent); filter: blur(30px); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <section class="copy">
    <div class="brand">
      <img class="icon" src="../../assets/icon/icon.png" alt="">
      <p class="name">Gilea<b>Launcher</b></p>
    </div>
    <h1>A modern Minecraft launcher,<br><em>fast</em> and <em>open source</em>.</h1>
    <p class="lead">Modpacks and mods from Modrinth and CurseForge, every Minecraft version with its loader, and as many builds as you like.</p>
    <ul class="chips">
      <li>Modrinth</li><li>CurseForge</li><li>Forge</li><li>NeoForge</li><li>Fabric</li><li>Quilt</li>
    </ul>
    <p class="os">Windows · Linux · macOS</p>
  </section>
  <div class="stage">
    <div class="shot back"><img src="builds.jpg" alt=""></div>
    <div class="shot mid"><img src="modpacks.jpg" alt=""></div>
    <div class="shot front"><img src="installed-mods.jpg" alt=""></div>
  </div>
</body>
</html>
