    <polygon points="206.6,520.2 359.3,608.4 359.3,432.0 206.6,343.9" fill="url(#left)"/>
    <polygon points="512.0,520.2 664.7,608.4 664.7,432.0 512.0,343.9" fill="url(#inner_left)"/>
