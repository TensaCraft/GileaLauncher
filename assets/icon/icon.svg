    <polygon points="664.7,255.7 817.4,343.9 664.7,432.0 512.0,343.9" fill="url(#top)"/>
    <polygon points="359.3,255.7 512.0,343.9 359.3,432.0 206.6,343.9" fill="url(#top)"/>
    <polygon points="512.0,520.2 664.7,608.4 512.0,696.5 359.3,608.4" fill="url(#floor)"/>
    <polygon points="817.4,696.5 664.7,784.7 664.7,608.4 817.4,520.2" fill="url(#right)"/>
    <polygon points="664.7,784.7 512.0,872.8 512.0,696.5 664.7,608.4" fill="url(#right)"/>
    <polygon points="817.4,520.2 664.7,608.4 664.7,432.0 817.4,343.9" fill="url(#right)"/>
    <polygon points="512.0,520.2 359.3,608.4 359.3,432.0 512.0,343.9" fill="url(#inner_right)"/>
    <polygon points="206.6,696.5 359.3,784.7 359.3,608.4 206.6,520.2" fill="url(#left)"/>
