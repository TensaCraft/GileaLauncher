    <polygon points="240.8,520.2 376.4,598.5 376.4,441.9 240.8,363.6" fill="url(#left)"/>
    <polygon points="512.0,520.2 647.6,598.5 647.6,441.9 512.0,363.6" fill="url(#inner_left)"/>
