    <polygon points="512.0,520.2 647.6,598.5 512.0,676.8 376.4,598.5" fill="none" stroke="#06200f" stroke-opacity="0.55" stroke-width="7.0" stroke-linejoin="round"/>
    <polygon points="783.2,676.8 647.6,755.0 647.6,598.5 783.2,520.2" fill="none" stroke="#06200f" stroke-opacity="0.55" stroke-width="7.0" stroke-linejoin="round"/>
    <polygon points="647.6,755.0 512.0,833.3 512.0,676.8 647.6,598.5" fill="none" stroke="#06200f" stroke-opacity="0.55" stroke-width="7.0" stroke-linejoin="round"/>
    <polygon points="783.2,520.2 647.6,598.5 647.6,441.9 783.2,363.6" fill="none" stroke="#06200f" stroke-opacity="0.55" stroke-width="7.0" stroke-linejoin="round"/>
    <polygon points="512.0,520.2 376.4,598.5 376.4,441.9 512.0,363.6" fill="none" stroke="#06200f" stroke-opacity="0.55" stroke-width="7.0" stroke-linejoin="round"/>
    <polygon points="240.8,676.8 376.4,755.0 376.4,598.5 240.8,520.2" fill="none" stroke="#06200f" stroke-opacity="0.55" stroke-width="7.0" stroke-linejoin="round"/>
    <polygon points="376.4,755.0 512.0,833.3 512.0,676.8 376.4,598.5" fill="none" stroke="#06200f" stroke-opacity="0.55" stroke-width="7.0" stroke-linejoin="round"/>
    <polygon points="240.8,520.2 376.4,598.5 376.4,441.9 240.8,363.6" fill="none" stroke="#06200f" stroke-opacity="0.55" stroke-width="7.0" stroke-linejoin="round"/>
    <polygon points="512.0,520.2 647.6,598.5 647.6,441.9 512.0,363.6" fill="none" stroke="#06200f" stroke-opacity="0.55" stroke-width="7.0" stroke-linejoin="round"/>
    <polygon points="512.0,207.1 647.6,285.4 512.0,363.6 376.4,285.4" fill="url(#shine)"/>
    <polygon points="647.6,285.4 783.2,363.6 647.6,441.9 512.0,363.6" fill="url(#shine)"/>
    <polygon points="376.4,285.4 512.0,363.6 376.4,441.9 240.8,363.6" fill="url(#shine)"/>
