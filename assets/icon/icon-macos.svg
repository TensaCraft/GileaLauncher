    <polygon points="376.4,285.4 512.0,363.6 376.4,441.9 240.8,363.6" fill="url(#top)"/>
    <polygon points="512.0,520.2 647.6,598.5 512.0,676.8 376.4,598.5" fill="url(#floor)"/>
    <polygon points="783.2,676.8 647.6,755.0 647.6,598.5 783.2,520.2" fill="url(#right)"/>
    <polygon points="647.6,755.0 512.0,833.3 512.0,676.8 647.6,598.5" fill="url(#right)"/>
    <polygon points="783.2,520.2 647.6,598.5 647.6,441.9 783.2,363.6" fill="url(#right)"/>
