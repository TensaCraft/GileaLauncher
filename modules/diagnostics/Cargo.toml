[package]
name = "module-diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true

# Postponed until after the release: `cargo xtask … --modules all` leaves this module out;
# `--modules diagnostics` builds it in.
[features]
backend = ["dep:launcher-core", "dep:regex", "dep:tracing"]
ui = ["dep:ui-kit", "dep:leptos", "dep:js-sys", "dep:wasm-bindgen"]

[dependencies]
launcher-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
regex = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
launcher-core = { workspace = true, optional = true }
ui-kit = { workspace = true, optional = true }
leptos = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "commands"
required-features = ["backend"]
