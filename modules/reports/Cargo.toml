[package]
name = "module-reports"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
backend = ["dep:launcher-core", "dep:reqwest", "dep:tokio", "dep:tracing", "dep:regex"]
ui = ["dep:ui-kit", "dep:leptos", "dep:serde"]

[dependencies]
launcher-shared.workspace = true
serde_json.workspace = true
launcher-core = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
ui-kit = { workspace = true, optional = true }
leptos = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["net"] }
tempfile.workspace = true

[[test]]
name = "payload"
required-features = ["backend"]

[[test]]
name = "send"
required-features = ["backend"]
