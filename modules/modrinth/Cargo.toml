[package]
name = "module-modrinth"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
backend = ["dep:launcher-core", "dep:reqwest", "dep:tokio", "dep:chrono", "dep:zip", "dep:tracing"]
ui = ["dep:ui-kit"]
# Plain HTTP files from this machine: the tests' fake Modrinth only (never an app build).
test-servers = []

[dependencies]
launcher-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
launcher-core = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
ui-kit = { workspace = true, optional = true }

[dev-dependencies]
module-modrinth = { path = ".", features = ["test-servers"] }
tempfile.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["net"] }
sha2.workspace = true
hex.workspace = true
zip.workspace = true

[[test]]
name = "api"
required-features = ["backend"]

[[test]]
name = "service"
required-features = ["backend"]

[[test]]
name = "plan"
required-features = ["backend"]

[[test]]
name = "duplicates"
required-features = ["backend"]

[[test]]
name = "icons"
required-features = ["backend"]

[[test]]
name = "updates"
required-features = ["backend"]

[[test]]
name = "packs"
required-features = ["backend"]

[[test]]
name = "pack_updates"
required-features = ["backend"]
