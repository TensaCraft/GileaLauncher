[package]
name = "module-tensa"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
backend = ["dep:launcher-core", "dep:reqwest", "dep:tokio", "dep:tracing", "dep:futures-util"]
ui = ["dep:ui-kit", "dep:leptos", "dep:serde"]

[dependencies]
launcher-shared.workspace = true
serde_json.workspace = true
launcher-core = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
ui-kit = { workspace = true, optional = true }
leptos = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["net"] }
tempfile.workspace = true
sha2.workspace = true

[[test]]
name = "api"
required-features = ["backend"]

[[test]]
name = "plan"
required-features = ["backend"]

[[test]]
name = "install"
required-features = ["backend"]

[[test]]
name = "sync"
required-features = ["backend"]

[[test]]
name = "provider"
required-features = ["backend"]

[[test]]
name = "hook"
required-features = ["backend"]

[[test]]
name = "home"
required-features = ["backend"]
